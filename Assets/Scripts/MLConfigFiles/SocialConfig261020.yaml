# 261020 - Opponent sensing, trained in the 261014 build. Copied from SocialConfig260929.yaml with
# extrinsic gamma reverted to 0.99, the 260723 value. lambd 0.95 and time_horizon 128 already match
# gamma 0.99 (1/(1-0.99) = 100 ~ time_horizon 128), so this is the 260723 credit-assignment set with
# the 260914 schedules.
#
# gamma 0.99 is for a mix of central and peripheral models. 260723 (gamma 0.99) gave 24 of 55
# peripheral runs, against 6 of 33 for 260929 (gamma 0.998). The earlier test of whether agents
# respond to their opponent used peripheral models, so this batch can repeat it with both seats
# sensing each other.
#
# Schedules are held at the 260929 values. max_steps is 4e6, down from 7e6, since a gamma 0.99 run
# levels off by about 3e6. beta_schedule keys off max_steps, so the entropy bonus decays to zero by
# 4e6 here, against 7e6 in 260929. 260723 also ran to 4e6, with linear learning rate and epsilon.
# See READMEs/training_hyperparameters.md and READMEs/opponent_sensing.md.
behaviors:
  OctagonAgentSocial:
    trainer_type: ppo
    max_steps: 4e06         # 260723 value (260914 and 260929 used 7e6). beta_schedule keys off it
    time_horizon: 128            # 260723 and 260929 value (260914 used 512)
    summary_freq: 20000          # How often stats are written to TensorBoard
    keep_checkpoints: 40         # Keep more checkpoints since we're saving less frequently. Divisor of max_steps
    checkpoint_interval: 100000  # Save .onnx checkpoint every 100k steps
    even_checkpoints: true       # ignore checkpoint_interval and instead save 40 checkpoints evenly spread across training

    hyperparameters:
      batch_size: 512           # Number of experiences used per training batch
      buffer_size: 20480
      learning_rate: 1.5e-4
      learning_rate_schedule: constant
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: constant
      lambd: 0.95               # 260723 and 260929 value (260914 used 0.99)
      num_epoch: 3

    network_settings:
      normalize: false
      hidden_units: 512         # Size of each hidden layer
      num_layers: 2              # How deep the network is
      #vis_encode_type: resnet    # Visual encoder type: simple, nature_cnn, resnet
      memory:
        sequence_length: 64      # Length of the sequence of experiences while training. Smaller values increase training
                                  # but reduce the distance into the past that the agent can remember.
                                  # Reduced to 64 from 128 on 260219
        memory_size: 256         # size of the float array used to store the hidden state of the RNN. Scales without amount
                                  # of information expected to be remembered in order to complete the task successfully.
                                  # This is very high, above the default of 128 and range of 32-256. Could consider reducing.
                                  # Reduced to 256 from 512 on 260219

    reward_signals:
      extrinsic:
        gamma: 0.99             # reverted to the 260723 value (260914 and 260929 used 0.998)
        strength: 1.0

      rnd:
        gamma: 0.99
        strength: 0.01 # if exploration is too low up to 0.1
        learning_rate: 0.0001

    # init_path: results/2602/260221/260221_02/OctagonAgentSolo/OctagonAgentSolo-3000005.pt

    self_play:
      window: 8                          # Increased from 5 - more opponent diversity to compensate for slower swaps
      play_against_latest_model_ratio: 0.5  # Keep 50/50 mix - play against current and historical opponents
      save_steps: 150000                 # TRIPLED from 50k - allows policy to stabilize between opponent updates
      swap_steps: 150000                 # TRIPLED from 50k - reduces non-stationarity shock, prevents jittery movement
      # team_change removed - octagon arena is symmetrical, no positional advantage


environment_parameters:
  step_penalty: 0.001
