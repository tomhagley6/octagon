behaviors:
  OctagonAgentSocial:
    trainer_type: ppo
    max_steps: 2e06          # Total training steps
    time_horizon: 128            # How many steps of experience per agent before updating
    summary_freq: 20000          # How often stats are written to TensorBoard
    keep_checkpoints: 10         # Keep more checkpoints since we're saving less frequently
    checkpoint_interval: 200000  # Save .onnx checkpoint every 200k steps

    hyperparameters:
      batch_size: 512           # Number of experiences used per training batch
      buffer_size: 10240        # Increased from 2048 - more experiences for stable gradients in self-play
      learning_rate: 3.0e-4
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: false
      hidden_units: 512         # Size of each hidden layer
      num_layers: 2              # How deep the network is
      #vis_encode_type: resnet    # Visual encoder type: simple, nature_cnn, resnet
      memory:
        sequence_length: 128
        memory_size: 512

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

      rnd:
        gamma: 0.99
        strength: 0.01 # if exploration is too low up to 0.1
        learning_rate: 0.0001

    # init_path: results/2601/260107/260107_5/OctagonAgentSolo/OctagonAgentSolo-2000113.pt
    
    self_play:
      window: 5                          # Reduced from 10 - fewer past opponents to maintain
      play_against_latest_model_ratio: 0.5  # Play against current model more often
      save_steps: 50000                  # Save less frequently for stability
      swap_steps: 50000                  # Swap less frequently for stability
      # team_change removed - octagon arena is symmetrical, no positional advantage 
    